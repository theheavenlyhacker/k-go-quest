name: CI

on: [push, pull_request]

jobs:
  node:
    name: backend + mobile (Turborepo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kgo_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: kgo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kgo_test -d kgo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kgo_test:disposable-ci-password@127.0.0.1:5432/kgo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx turbo run check
      - run: npm audit --omit=dev --workspace khan-go-quests-backend

  ml:
    name: ml (BKT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
